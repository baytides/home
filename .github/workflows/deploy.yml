name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        run: npm run build

      # functions/api/carbon-stats.ts reads Cloudflare analytics at request time.
      # Its secrets come from repo secrets here, so they never need setting by hand.
      # They are set before the deploy so the new deployment picks them up.
      - name: Set Pages Function secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_SUSTAINABILITY_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GITHUB_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          printf '%s' "$ANALYTICS_TOKEN" | npx wrangler pages secret put CLOUDFLARE_ANALYTICS_TOKEN --project-name=baytides-website
          printf '%s' "$ZONE_ID" | npx wrangler pages secret put CLOUDFLARE_ZONE_ID --project-name=baytides-website
          if [ -n "$GITHUB_STATS_TOKEN" ]; then
            printf '%s' "$GITHUB_STATS_TOKEN" | npx wrangler pages secret put GITHUB_STATS_TOKEN --project-name=baytides-website
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=baytides-website --commit-dirty=true

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
