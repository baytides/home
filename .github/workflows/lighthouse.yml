name: Lighthouse CI

# This audits the LIVE production URLs, so it must run AFTER the deploy that
# publishes the commit -- not alongside it. Previously it triggered on `push`,
# which raced `Deploy to Cloudflare Pages` and reported pre-deploy numbers
# (on 2026-08-31 it failed a commit on 6.90-10.17 MB pages that the same commit
# had just reduced to well under 2 MB).
#
# `pull_request` is deliberately absent for the same reason: auditing production
# tells you nothing about a pull request's own changes.
on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Auditing a failed deploy would just measure whatever is still live.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://baytides.org/
            https://baytides.org/about/
            https://baytides.org/contact/
            https://baytides.org/accessibility/
            https://baytides.org/projects/
            https://baytides.org/volunteer/
            https://baytides.org/events/
            https://baytides.org/security/
            https://baytides.org/privacy/
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
